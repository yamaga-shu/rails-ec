name: rails-ec

services:
  app:
    container_name: app
    build:
      context: ../../
      dockerfile: .infra/development/app/Dockerfile
    volumes:
      - ../../:/app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PPOSTGRES_MULTIPLE_DATABASES=${POSTGRES_DB_DEV},${POSTGRES_DB_TEST}
      - POSTGRES_DB=${POSTGRES_DB_DEV}
      - POSTGRES_DB_TEST=${POSTGRES_DB_TEST}
    depends_on:
      db:
        condition: service_healthy
    tty: true
    command: bin/rails server -b 0.0.0.0 -e development

  db:
    container_name: db
    platform: linux/x86_64
    build:
      context: ./db
      dockerfile: Dockerfile
    healthcheck:
      test: "pg_isready -U postgres || exit 1"
      interval: 2s
      timeout: 3s
      retries: 3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./db/data:/var/lib/postgresql
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf
    command: -c 'config_file=/etc/postgresql/postgresql.conf'

  mail:
    container_name: mail
    build:
      context: ./mail
      dockerfile: Dockerfile
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_DATABASE=/data/mailpit.db
      - TZ=Asia/Tokyo
    volumes:
      - ./mail/data:/data
    tty: true